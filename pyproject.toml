[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kicad-part-db"
version = "0.1.0"
description = "A personal component database for PCBA designs, with a KiCad interface for building BOMs quickly."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
parts = "partsdb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/partsdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
